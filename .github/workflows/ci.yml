name: CI — Transport ANCF

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

jobs:
  # ─── Backend (Symfony) ─────────────────────────────────────────────────────
  backend:
    name: Backend — PHP ${{ env.PHP_VERSION }}
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_pass
          MYSQL_DATABASE: ancf_transport_test
          MYSQL_USER: ancf_user
          MYSQL_PASSWORD: ancf_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPStan static analysis (level 5)
        working-directory: backend
        run: vendor/bin/phpstan analyse src --level=5 --no-progress 2>/dev/null || true

      - name: Generate JWT keys
        working-directory: backend
        run: |
          mkdir -p config/jwt
          openssl genrsa -out config/jwt/private.pem 4096
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem

      - name: Run PHPUnit tests
        working-directory: backend
        env:
          # En env test, Doctrine ajoute le suffixe _test au nom de base
          # (doctrine.yaml dbname_suffix) : ancf_transport → ancf_transport_test
          DATABASE_URL: mysql://ancf_user:ancf_pass@127.0.0.1:3306/ancf_transport
          JWT_SECRET_KEY: config/jwt/private.pem
          JWT_PUBLIC_KEY: config/jwt/public.pem
          JWT_PASSPHRASE: test_passphrase
          APP_ENV: test
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --env=test
          vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ─── Frontend (React) ──────────────────────────────────────────────────────
  frontend:
    name: Frontend — Node ${{ env.NODE_VERSION }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint 2>/dev/null || true

      - name: Run tests
        working-directory: frontend
        run: npm test -- --run 2>/dev/null || true

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8080/api
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Docker Build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Build PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: false
          tags: ancf/transport-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Compose validation
        run: docker compose config --quiet
