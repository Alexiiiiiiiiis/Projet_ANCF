framework:
    cache:
        app: cache.adapter.filesystem
        system: cache.adapter.system
        directory: '%kernel.cache_dir%/pools'
        pools:
            idfm.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            # Référencés par doctrine.yaml (when@prod) pour le cache de requêtes/résultats —
            # DoctrineBundle ne les crée pas automatiquement, il faut les déclarer soi-même.
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system

parameters:
    # Valeur par défaut : nom du service Redis dans docker-compose. Un hébergeur PaaS
    # (Railway, Clever Cloud…) fournit sa propre URL, à passer via la variable REDIS_URL.
    env(REDIS_URL): 'redis://redis:6379'

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'
