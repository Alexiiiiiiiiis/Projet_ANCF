framework:
    cache:
        app: cache.adapter.filesystem
        system: cache.adapter.system
        directory: '%kernel.cache_dir%/pools'
        pools:
            idfm.cache:
                adapter: cache.adapter.filesystem
                default_lifetime: 300
            # Référencés par doctrine.yaml (when@prod) pour le cache de requêtes/résultats —
            # DoctrineBundle ne les crée pas automatiquement, il faut les déclarer soi-même.
            doctrine.result_cache_pool:
                adapter: cache.app
            doctrine.system_cache_pool:
                adapter: cache.system

# Le cache applicatif de production est configuré dans cache.php : le choix de l'adaptateur
# dépend de la présence d'un Redis chez l'hébergeur, et ne peut pas s'exprimer ici (voir le
# commentaire de ce fichier).
