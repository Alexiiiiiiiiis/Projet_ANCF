framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: true
    handle_all_throwables: true
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

parameters:
    # Derrière le répartiteur de charge d'un PaaS, la requête arrive en HTTP depuis une IP
    # privée : sans ces réglages Symfony croit le site en clair et ignore X-Forwarded-Proto.
    env(TRUSTED_PROXIES): 'private_ranges'

when@prod:
    framework:
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers:
            - 'x-forwarded-for'
            - 'x-forwarded-host'
            - 'x-forwarded-proto'
            - 'x-forwarded-port'
