version: '3.9'

services:
  php:
    # Image construite et poussée par .github/workflows/cd.yml (docker/php/Dockerfile) —
    # le code applicatif est déjà intégré à l'image, pas de volume à monter.
    image: ${DOCKER_IMAGE_PREFIX:-ancf}/transport-backend:${VERSION:-latest}
    container_name: ancf_php_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: /var/www/backend/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/backend/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      IDFM_API_KEY: ${IDFM_API_KEY}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      # Clés générées une fois sur l'hôte (cf. README § Déploiement) — jamais buildées dans
      # l'image, qui est publique sur Docker Hub.
      - ./config/jwt:/var/www/backend/config/jwt:ro
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ancf_network

  nginx:
    # Image construite et poussée par .github/workflows/cd.yml (docker/nginx/Dockerfile) —
    # le build React et la config prod sont déjà intégrés à l'image.
    image: ${DOCKER_IMAGE_PREFIX:-ancf}/transport-nginx:${VERSION:-latest}
    container_name: ancf_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - ancf_network

  mysql:
    image: mysql:8.0
    container_name: ancf_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ancf_transport}
      MYSQL_USER: ${MYSQL_USER:-ancf_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ancf_network

  redis:
    image: redis:7-alpine
    container_name: ancf_redis_prod
    restart: unless-stopped
    networks:
      - ancf_network

volumes:
  mysql_data_prod:

networks:
  ancf_network:
    driver: bridge
