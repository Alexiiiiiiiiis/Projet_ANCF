version: '3.9'

services:
  # ─── PHP / Symfony ────────────────────────────────────────────────────────
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ancf_php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      # vendor/ et var/ sur des volumes natifs Linux : le montage Windows est
      # trop lent pour les milliers de fichiers lus à chaque requête PHP
      - backend_vendor:/var/www/backend/vendor
      - backend_var:/var/www/backend/var
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://${MYSQL_USER:-ancf_user}:${MYSQL_PASSWORD:-ancf_pass}@mysql:3306/${MYSQL_DATABASE:-ancf_transport}?serverVersion=8.0&charset=utf8mb4
      JWT_SECRET_KEY: /var/www/backend/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/backend/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-ancf_secret}
      IDFM_API_KEY: ${IDFM_API_KEY:-}
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
      # Le service redis ci-dessous existe : sans cette variable, l'application retombe sur le
      # cache disque (cf. backend/config/packages/cache.php) et le conteneur tourne pour rien.
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ancf_network

  # ─── Nginx ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: ancf_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend/public:/var/www/backend/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - ancf_network

  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ancf_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ancf_transport}
      MYSQL_USER: ${MYSQL_USER:-ancf_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ancf_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-ancf_user}", "-p${MYSQL_PASSWORD:-ancf_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ancf_network

  # ─── PhpMyAdmin ───────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: ancf_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER:-ancf_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-ancf_pass}
    depends_on:
      - mysql
    networks:
      - ancf_network

  # ─── React Frontend ───────────────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: ancf_frontend
    working_dir: /app
    command: sh -c "[ -d node_modules ] || npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080/api
    networks:
      - ancf_network

  # ─── Redis (cache) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ancf_redis
    ports:
      - "6379:6379"
    networks:
      - ancf_network

volumes:
  mysql_data:
  node_modules:
  backend_vendor:
  backend_var:

networks:
  ancf_network:
    driver: bridge
