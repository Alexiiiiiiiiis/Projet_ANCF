; Réglages PHP de production pour l'image API (docker/api/Dockerfile).

expose_php = Off
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Europe/Paris

; Les erreurs partent sur la sortie standard (collectée par l'hébergeur), jamais dans la
; réponse HTTP : une stack trace renvoyée au client exposerait chemins et configuration.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Le code est figé dans l'image : inutile de vérifier les dates de modification.
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
