; Transport ANCF - PHP Configuration

[PHP]
display_errors = On
error_reporting = E_ALL
log_errors = On

memory_limit = 256M
max_execution_time = 30
max_input_time = 60
post_max_size = 20M
upload_max_filesize = 10M

; OPcache (development)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; revalide les fichiers au plus toutes les 2s (au lieu de chaque requête)
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1

; Realpath cache : indispensable sur montage de fichiers lent (Docker Windows)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Date
date.timezone = Europe/Paris
